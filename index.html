<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Cuối Ngày (Giờ VN)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Thời Gian Còn Lại Hôm Nay</h1>
        <div class="timezone-info">Múi giờ: Việt Nam (GMT+7)</div>
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="time" id="hours">00</span>
                <span class="label">Giờ</span>
            </div>
            <div class="separator">:</div>
            <div class="time-box">
                <span class="time" id="minutes">00</span>
                <span class="label">Phút</span>
            </div>
            <div class="separator">:</div>
            <div class="time-box">
                <span class="time" id="seconds">00</span>
                <span class="label">Giây</span>
            </div>
        </div>
        <div class="message" id="message"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
